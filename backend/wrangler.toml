name = "fal-miro-backend"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

# Non-secret config. Override per-environment below, or with `--var` on
# `wrangler dev` / `wrangler deploy`.
[vars]
# Every origin your frontend is served from. The local dev server is here by
# default; add your own deployment (e.g. "https://your-org.github.io") before
# the panel will be allowed to talk to this backend.
ALLOWED_ORIGINS = "http://localhost:5175"
FAL_PLATFORM_API_BASE = "https://api.fal.ai/v1"
# Verbose per-request logging, including a summary of every generation input.
# Off by default; set to "1" while debugging.
DEBUG = "0"

# FAL_KEY, ADMIN_KEY, and BACKEND_KEY are secrets, not vars — they don't belong
# in this file (it's committed to git). Set them with:
#   wrangler secret put FAL_KEY
#   wrangler secret put ADMIN_KEY
#   wrangler secret put BACKEND_KEY       # any random string; required — every
#                                         # /api/fal/* request is rejected
#                                         # without a matching x-fal-proxy-key
#                                         # header
# For local `wrangler dev`, put them in a gitignored `.dev.vars` file instead
# (copy `.dev.vars.example`).
