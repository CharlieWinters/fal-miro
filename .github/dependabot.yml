version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn; anything major still comes through alone.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to SHAs, so this is how they get bumped at all.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
