# Runs on every PR and every push to main. This is the gate CONTRIBUTING.md
# tells contributors to run locally, so keep the two in step.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend — typecheck, boundaries, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      # The bulkheads: no app/agent/screen may import a sibling.
      # See CONTRIBUTING.md, "Duplicate behaviour, share contracts".
      - run: npm run lint:boundaries
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: backend — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
