<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fal for Miro — Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <!--
    Miro has no native video widget, but its embed widget renders any
    iframable URL — this static page is what those embeds point at. Ships
    with the frontend build (no backend involved): the ?url= param is a
    plain Fal CDN URL, played back directly, no proxy needed.

    See src/lib/api.ts's videoEmbedUrl() for how this URL gets built.
  -->
  <video id="player" controls autoplay muted loop playsinline></video>
  <script>
    const url = new URLSearchParams(window.location.search).get('url');
    const player = document.getElementById('player');
    if (url && /^https?:\/\//.test(url)) {
      player.src = url;
      grabPoster(url, (poster) => { player.poster = poster; });
    } else {
      document.body.textContent = 'Missing or invalid url';
    }

    /**
     * Paint the first frame onto the player as its poster, so an iframe that
     * cannot autoplay shows the shot instead of a black rectangle.
     *
     * The grab runs on a SEPARATE hidden element that opts into CORS, never on
     * the player itself. Putting crossorigin="anonymous" on the player would
     * turn its fetch into a CORS request, and any host that does not send
     * Access-Control-Allow-Origin — archive.org, and most of what "Add video
     * from URL" accepts — would stop playing at all. Fal's CDN does send it
     * (embed-panorama.html already depends on that for its WebGL texture), so
     * this succeeds for generated video and silently does nothing elsewhere.
     *
     * Every failure path is a no-op: no CORS headers, a codec the probe cannot
     * decode, a tainted canvas. The page is exactly as it was before.
     */
    function grabPoster(src, onPoster) {
      let probe;
      try {
        probe = document.createElement('video');
      } catch { return; }
      probe.crossOrigin = 'anonymous';
      probe.muted = true;
      probe.preload = 'metadata';
      // A media fragment makes the browser seek a little way in and decode a
      // frame; frame zero of a fade-in is often just black.
      probe.src = src + (src.includes('#') ? '' : '#t=0.1');

      const release = () => {
        probe.removeAttribute('src');
        try { probe.load(); } catch { /* nothing to release */ }
      };

      probe.addEventListener('loadeddata', () => {
        try {
          const w = probe.videoWidth || 0;
          const h = probe.videoHeight || 0;
          if (!w || !h) return release();
          // A poster only has to look right at board scale. Capping the long
          // edge keeps the data URI in the tens of kilobytes.
          const scale = Math.min(1, 640 / w);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          canvas.getContext('2d').drawImage(probe, 0, 0, canvas.width, canvas.height);
          // Throws on a tainted canvas, which is the no-CORS case.
          const poster = canvas.toDataURL('image/jpeg', 0.7);
          release();
          onPoster(poster);
        } catch {
          release();
        }
      }, { once: true });

      probe.addEventListener('error', release, { once: true });
    }
  </script>
  <script>
    // Swallow the browser's page-zoom gesture.
    //
    // A trackpad pinch arrives as wheel + ctrlKey (Safari also fires gesture*
    // events). On the board, Miro's canvas listens for that and turns it into
    // board zoom — but this page is a CROSS-ORIGIN iframe, so those events go
    // to this document and Miro never sees them. Nothing calls preventDefault,
    // the browser's default action runs, and it zooms the whole top-level
    // miro.com page. What that looks like to the user is the board's zoom
    // breaking whenever they pinch over a video.
    //
    // Only the zoom gesture is swallowed. Plain wheel is deliberately left
    // alone so it still reaches whatever this page renders (model-viewer's
    // camera zoom on the 3D pages) — the board can't receive it either way.
    addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      addEventListener(type, (e) => e.preventDefault());
    }
  </script>
</body>
</html>
