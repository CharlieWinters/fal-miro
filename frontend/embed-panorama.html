<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fal for Miro — Panorama</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js" integrity="sha384-Q1xJxUu3g9dfxTQcxLUjh6fUzeztZikm/bryr9+vQ/OT6MIrfMvjxeYlvtA/B5ES" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14142b; }
    a-scene { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!--
    Static page (see embed-video.html). Image-to-panorama (Hunyuan World)
    returns an equirectangular 2:1 image; mapped onto the inside of a sphere
    so the board shows an interactive photosphere — drag to look around.

    crossorigin="anonymous" + Fal's CDN sending Access-Control-Allow-Origin
    is what lets A-Frame use this as a WebGL texture without the browser
    refusing it — verified live (canvas readback un-tainted) before cutting
    the previous backend /proxy dependency for this page.
  -->
  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false" cursor="rayOrigin: mouse">
    <a-assets>
      <img id="pano" crossorigin="anonymous" />
    </a-assets>
    <a-sky src="#pano"></a-sky>
  </a-scene>
  <script>
    const url = new URLSearchParams(window.location.search).get('url');
    if (url && /^https?:\/\//.test(url)) {
      document.getElementById('pano').src = url;
    } else {
      document.body.textContent = 'Missing or invalid url';
    }
  </script>
  <script>
    // Swallow the browser's page-zoom gesture.
    //
    // A trackpad pinch arrives as wheel + ctrlKey (Safari also fires gesture*
    // events). On the board, Miro's canvas listens for that and turns it into
    // board zoom — but this page is a CROSS-ORIGIN iframe, so those events go
    // to this document and Miro never sees them. Nothing calls preventDefault,
    // the browser's default action runs, and it zooms the whole top-level
    // miro.com page. What that looks like to the user is the board's zoom
    // breaking whenever they pinch over a video.
    //
    // Only the zoom gesture is swallowed. Plain wheel is deliberately left
    // alone so it still reaches whatever this page renders (model-viewer's
    // camera zoom on the 3D pages) — the board can't receive it either way.
    addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      addEventListener(type, (e) => e.preventDefault());
    }
  </script>
</body>
</html>
