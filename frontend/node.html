<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fal for Miro — Node</title>
  <style>
    :root {
      --bg: #0f0f11; --card: #141417; --card-2: #1c1c20;
      --border: rgba(255, 255, 255, 0.09); --fg: #f4f4f6; --fg-2: #c9c9cf;
      --muted: #8a8a92; --accent: #ffdd33; --on-accent: #050505; --err: #f25a6e;
      font-family: 'Roobert PRO', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header {
      display: flex; align-items: baseline; gap: 6px; padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand { font: italic 900 15px 'Roobert PRO', system-ui, sans-serif; color: var(--accent); }
    .brand-sub { font-size: 12px; color: var(--muted); }
    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .model { font-size: 13px; color: var(--fg-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 12px; padding: 3px 9px; border-radius: 999px;
      background: var(--card-2); border: 1px solid var(--border); color: var(--fg-2);
    }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .prompt { font-size: 13px; line-height: 1.45; color: var(--fg-2); white-space: pre-wrap; }
    ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: var(--fg-2); }
    .result img { display: block; width: 100%; border-radius: 8px; }
    .result .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    footer { padding: 12px 14px; border-top: 1px solid var(--border); }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent); color: var(--on-accent); font-family: inherit; font-size: 14px; font-weight: 700;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    button + button { margin-top: 8px; }
    button.secondary { background: transparent; color: var(--fg-2); border: 1px solid var(--border); }
    .job { border-color: rgba(255, 221, 51, 0.4); }
    .job.failed { border-color: rgba(242, 90, 110, 0.5); }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
    .note.err { color: var(--err); }
    .centre {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; gap: 10px; padding: 24px; color: var(--fg-2); font-size: 14px; line-height: 1.5;
    }
    .centre a { color: var(--accent); }
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!--
    An embed node: one shot's settings on the board, in place of a settings
    card. This page has no Miro SDK. It asks the Fal for Miro app's headless
    iframe for its state over postMessage and renders what comes back. See
    src/shared/node.ts for the design and src/embed/nodePage.ts for this side.
    The URL carries only ?nid=<uuid>&cb=<cache-buster>.
  -->
  <header><span class="brand">fal</span><span class="brand-sub">node</span></header>
  <div id="root" class="centre">Connecting to Fal for Miro…</div>
  <script type="module" src="/src/embed/nodePage.ts"></script>
  <script>
    // Swallow the browser's page-zoom gesture — same guard as every other
    // embed page (see embed-video.html for why).
    addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      addEventListener(type, (e) => e.preventDefault());
    }
  </script>
</body>
</html>
