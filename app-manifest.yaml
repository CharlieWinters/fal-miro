# Paste into the "App Manifest" section of your Miro app at
# https://miro.com/app/settings/user-profile/apps/  (after creating an app).
# Replace `https://your-frontend.example.com` with wherever you host the
# static build (Netlify, S3+CloudFront, Vercel, etc).

# Naming follows Miro's "<Your app> for Miro" convention for third-party apps
# (developers.miro.com/docs/design-guidelines, "App names"). The app is
# independent and unofficial — not affiliated with, endorsed by, or supported
# by Miro or fal.ai. The manifest has no description field; paste this into the
# app's Description in the developer dashboard so installers see it too:
#
#   Generate images, video, 3D models and audio on your board with fal.ai
#   models. An independent, unofficial project — not affiliated with, endorsed
#   by, or supported by Miro or fal.ai. Bring your own fal key or backend;
#   generations bill your own fal account.
appName: Fal for Miro
sdkVersion: SDK_V2

sdkUri: https://your-frontend.example.com/index.html

scopes:
  - boards:read
  - boards:write
  - identity:read

redirectUris:
  - https://your-frontend.example.com/

icons:
  - src: https://your-frontend.example.com/icon.svg
    size: 24

# When the user clicks the app icon, the headless (sdkUri) iframe loads and
# calls miro.board.ui.openPanel({ url: 'app.html' }).
